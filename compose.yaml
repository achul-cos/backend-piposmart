name: crm-piposmart

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-crm_piposmart}
      MYSQL_USER: ${DB_USER:-crm_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-change-me}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  migrate:
    build:
      context: .
    profiles:
      - tools
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      MIGRATION_DIR: /app/migrations
    command:
      - migrate
      - up
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  setup:
    build:
      context: .
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      MIGRATION_DIR: /app/migrations
      SETUP_RUN_MIGRATE: ${SETUP_RUN_MIGRATE:-true}
      SETUP_RUN_SEED_MASTER: ${SETUP_RUN_SEED_MASTER:-true}
      SETUP_RUN_BOOTSTRAP_ADMIN: ${SETUP_RUN_BOOTSTRAP_ADMIN:-true}
      SETUP_RUN_DEMO_SEED: ${SETUP_RUN_DEMO_SEED:-true}
      SETUP_DEMO_PRESET: ${SETUP_DEMO_PRESET:-minimal}
      SETUP_DEMO_SEED: ${SETUP_DEMO_SEED:-20260723}
      SETUP_DEMO_FROM: ${SETUP_DEMO_FROM:-2026-07-28}
      SETUP_DEMO_TO: ${SETUP_DEMO_TO:-2026-07-28}
      SETUP_DEMO_SCALE: ${SETUP_DEMO_SCALE:-1}
      SETUP_DEMO_VARIATION: ${SETUP_DEMO_VARIATION:-0.5}
    command:
      - setup
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads:/app/storage/uploads
      - exports:/app/storage/exports
    restart: "no"

  api:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      MIGRATION_DIR: /app/migrations
    command:
      - api
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - uploads:/app/storage/uploads
      - exports:/app/storage/exports
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - "-"
        - http://127.0.0.1:8080/health/live
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      MIGRATION_DIR: /app/migrations
    command:
      - worker
    volumes:
      - uploads:/app/storage/uploads
      - exports:/app/storage/exports
    depends_on:
      setup:
        condition: service_completed_successfully

  seed:
    build:
      context: .
    profiles:
      - seed
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      MIGRATION_DIR: /app/migrations
    command:
      - seed
      - demo
      - --preset=${SETUP_DEMO_PRESET:-minimal}
      - --seed=${SETUP_DEMO_SEED:-20260723}
      - --from=${SETUP_DEMO_FROM:-2026-07-28}
      - --to=${SETUP_DEMO_TO:-2026-07-28}
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: "no"

volumes:
  mysql_data:
  uploads:
  exports:
