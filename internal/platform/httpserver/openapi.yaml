components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    OwnerID:
      name: owner_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    OutletID:
      name: outlet_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    LeadID:
      name: lead_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TrainingID:
      name: training_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SearchQuery:
      name: q
      in: query
      required: false
      schema:
        type: string
      description: Search global untuk kode, nama, telepon, brand, kota, dan provinsi.
    CodeQuery:
      name: code
      in: query
      required: false
      schema:
        type: string
    NameQuery:
      name: name
      in: query
      required: false
      schema:
        type: string
    PhoneQuery:
      name: phone
      in: query
      required: false
      schema:
        type: string
    BrandNameQuery:
      name: brand_name
      in: query
      required: false
      schema:
        type: string
    ProvinceQuery:
      name: province
      in: query
      required: false
      schema:
        type: string
    CityQuery:
      name: city
      in: query
      required: false
      schema:
        type: string
    PageQuery:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
    CreateSalesRequest:
      type: object
      required: [name, email]
      properties:
        code:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          format: password
          description: Optional; jika kosong sistem membuat temporary password.
    UpdateSalesRequest:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
    ResetPasswordRequest:
      type: object
      properties:
        new_password:
          type: string
          format: password
          description: Optional; jika kosong sistem membuat temporary password.
    CreateOwnerRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          example: OWN-00001
        name:
          type: string
          example: Budi Santoso
        phone:
          type: string
          example: "0812-3456-7890"
        email:
          type: string
          format: email
        brand_name:
          type: string
          example: Laundry Cerah
        province:
          type: string
          example: Jawa Barat
        city:
          type: string
          example: Bandung
        address:
          type: string
    UpdateOwnerRequest:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        brand_name:
          type: string
        province:
          type: string
        city:
          type: string
        address:
          type: string
    CreateOutletRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          example: OUT-00001
        name:
          type: string
          example: Laundry Cerah Outlet 1
        phone:
          type: string
          example: "0812-3456-7891"
        province:
          type: string
          example: Jawa Barat
        city:
          type: string
          example: Bandung
        address:
          type: string
    UpdateOutletRequest:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        phone:
          type: string
        province:
          type: string
        city:
          type: string
        address:
          type: string
    BulkIDRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
          example: [1, 2, 3]
    BulkOwnerCreateRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateOwnerRequest"
    BulkOwnerUpdateRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/BulkOwnerUpdateItem"
    BulkOwnerUpdateItem:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
        - $ref: "#/components/schemas/UpdateOwnerRequest"
    BulkOutletCreateRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateOutletRequest"
    BulkOutletUpdateRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/BulkOutletUpdateItem"
    BulkOutletUpdateItem:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
        - $ref: "#/components/schemas/UpdateOutletRequest"
    CreateLeadRequest:
      type: object
      required: [owner_id]
      properties:
        owner_id:
          type: integer
          format: int64
        outlet_id:
          type: integer
          format: int64
          nullable: true
        source_type:
          type: string
          example: MANUAL
        source_reference:
          type: string
    AssignSupervisorRequest:
      type: object
      required: [supervisor_id]
      properties:
        supervisor_id:
          type: integer
          format: int64
        reason:
          type: string
          example: Distribusi dari Admin ke Supervisor
    BulkAssignSupervisorRequest:
      type: object
      required: [lead_ids, supervisor_id]
      properties:
        lead_ids:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
        supervisor_id:
          type: integer
          format: int64
        reason:
          type: string
    AssignSalesRequest:
      type: object
      required: [sales_id]
      properties:
        sales_id:
          type: integer
          format: int64
        reason:
          type: string
          example: Distribusi dari Supervisor ke Sales
    BulkAssignSalesRequest:
      type: object
      required: [lead_ids, sales_id]
      properties:
        lead_ids:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
        sales_id:
          type: integer
          format: int64
        reason:
          type: string
    ReleaseLeadRequest:
      type: object
      properties:
        admin_id:
          type: integer
          format: int64
          nullable: true
        reason:
          type: string
          example: Dikembalikan ke Admin
    BulkReleaseLeadRequest:
      type: object
      required: [lead_ids]
      properties:
        lead_ids:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
        admin_id:
          type: integer
          format: int64
          nullable: true
        reason:
          type: string
    MarkInvalidRequest:
      type: object
      properties:
        reason:
          type: string
          example: Customer tidak potensial dari call terakhir
    CreateInteractionRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [CALL, CHAT]
          example: CALL
        interaction_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-07-23T10:00:00+07:00"
        contact_name:
          type: string
          example: Budi Santoso
        contact_phone:
          type: string
          example: "081234567890"
        duration_seconds:
          type: integer
          nullable: true
          example: 300
        remark_reason_id:
          type: integer
          format: int64
          nullable: true
        remark_score:
          type: integer
