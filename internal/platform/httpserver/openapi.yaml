          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Daftar target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/kpi-definitions:
    post:
      tags: [KPI Definition]
      summary: Buat KPI definition
      operationId: createKpiDefinition
      description: Definisi bobot & threshold satu metric untuk satu periode. Total weight aktif per periode harus tepat 100% (divalidasi saat recompute, bukan saat create). Hanya ADMIN dan SUPERVISOR.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKpiDefinitionRequest"
      responses:
        "201":
          description: KPI definition berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Payload tidak valid (weight/threshold/metric_code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Akses ditolak (bukan ADMIN/SUPERVISOR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Definisi aktif untuk metric & periode ini sudah ada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      tags: [KPI Definition]
      summary: List KPI definitions
      operationId: listKpiDefinitions
      security:
        - bearerAuth: []
      parameters:
        - name: period_year
          in: query
          schema:
            type: integer
        - name: period_month
          in: query
          schema:
            type: integer
        - name: active_only
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Daftar KPI definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/kpi-definitions/{id}:
    get:
      tags: [KPI Definition]
      summary: Get KPI definition
      operationId: getKpiDefinition
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Detail KPI definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "404":
          description: Definisi tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/kpi-definitions/{id}/deactivate:
    patch:
      tags: [KPI Definition]
      summary: Nonaktifkan KPI definition
      operationId: deactivateKpiDefinition
      description: Effective-dating berarti supersede via definisi baru, bukan update di tempat — sama seperti commission_rules Sprint 12. Hanya ADMIN dan SUPERVISOR.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Definisi berhasil dinonaktifkan
        "403":
          description: Akses ditolak (bukan ADMIN/SUPERVISOR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Definisi tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/kpi/recompute:
    post:
      tags: [KPI]
      summary: Enqueue KPI recompute untuk satu periode
      operationId: recomputeKpi
      description: Asinkron — diproses background worker (job_queue, MySQL, tanpa Redis). Idempoten, aman dijalankan berulang untuk periode yang sama. Hanya ADMIN dan SUPERVISOR.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecomputeRequest"
      responses:
        "202":
          description: Job recompute berhasil di-enqueue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Payload tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Akses ditolak (bukan ADMIN/SUPERVISOR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/kpi/jobs/{id}:
    get:
      tags: [KPI]
      summary: Cek status job recompute
      operationId: getKpiJob
      description: "Status: PENDING, PROCESSING, COMPLETED, atau FAILED (lihat last_error)."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Status job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "404":
          description: Job tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/kpi/results:
    get:
      tags: [KPI]
      summary: List hasil KPI
      operationId: listKpiResults
      description: Sales hanya melihat hasil miliknya sendiri (termasuk rank_position-nya). Admin/Supervisor melihat semua, bisa difilter.
      security:
        - bearerAuth: []
      parameters:
        - name: sales_id
          in: query
          schema:
            type: integer
            format: int64
        - name: period_year
          in: query
          schema:
            type: integer
        - name: period_month
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Daftar hasil KPI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/kpi/ranking:
    get:
      tags: [KPI]
      summary: List ranking sales satu periode
      operationId: listKpiRanking
      description: Daftar terurut lengkap satu periode. Hanya ADMIN dan SUPERVISOR (Sales tidak dapat mengakses daftar penuh, hanya rank_position miliknya sendiri lewat /kpi/results).
      security:
        - bearerAuth: []
      parameters:
        - name: period_year
          in: query
          required: true
          schema:
            type: integer
        - name: period_month
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Daftar ranking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "403":
          description: Akses ditolak (bukan ADMIN/SUPERVISOR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/imports:
    post:
      tags: [Imports]
      summary: Upload Excel file untuk import
      operationId: uploadImport
      description: Hanya ADMIN. Dedup berdasarkan SHA-256 file — upload file yang sama mengembalikan batch yang sudah ada. Validasi berjalan async lewat worker (job_queue). Profil (OWNER_OUTLET/NON_REGISTER) bisa dideklarasikan eksplisit atau dibiarkan auto-detect dari header kolom.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                profile:
                  type: string
                  enum: [OWNER_OUTLET, NON_REGISTER]
      responses:
        "201":
          description: Batch berhasil diupload (atau batch existing dikembalikan bila file sama)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: File tidak valid (bukan .xlsx, terlalu besar, atau kosong)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Akses ditolak (bukan ADMIN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      tags: [Imports]
      summary: List import batch
      operationId: listImportBatches
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: profile
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Daftar batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/imports/{id}:
    get:
      tags: [Imports]
      summary: Detail import batch
      operationId: getImportBatch
      description: Status dan counts (total/valid/invalid/committed) jadi preview sebelum commit.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Detail batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "404":
          description: Batch tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/imports/{id}/rows:
    get:
      tags: [Imports]
      summary: List baris dalam satu batch
      operationId: listImportRows
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          description: PENDING, VALID, INVALID, COMMITTED, atau COMMIT_FAILED
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Daftar baris
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/imports/{id}/rejected-rows/export:
    get:
      tags: [Imports]
      summary: Unduh baris invalid sebagai CSV
      operationId: exportRejectedRows
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: File CSV berisi baris invalid + alasan
          content:
            text/csv:
              schema:
                type: string
                format: binary
  /api/v1/imports/{id}/commit:
    post:
      tags: [Imports]
      summary: Commit batch yang sudah divalidasi
      operationId: commitImportBatch
      description: Hanya ADMIN. Ditolak kalau batch belum berstatus VALIDATED atau sudah pernah di-commit — inilah gerbang "preview harus disetujui dulu". Berjalan async; poll GET /imports/{id} untuk status.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "202":
          description: Commit di-enqueue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Batch belum VALIDATED atau sudah COMMITTED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Akses ditolak (bukan ADMIN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    OwnerID:
      name: owner_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    OutletID:
      name: outlet_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    LeadID:
      name: lead_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TrainingID:
      name: training_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ClosingID:
      name: closing_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PaymentID:
      name: payment_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SearchQuery:
      name: q
      in: query
      required: false
      schema:
        type: string
      description: Search global untuk kode, nama, telepon, brand, kota, dan provinsi.
    CodeQuery:
      name: code
      in: query
      required: false
      schema:
        type: string
    NameQuery:
      name: name
      in: query
      required: false
      schema:
        type: string
    PhoneQuery:
      name: phone
      in: query
      required: false
      schema:
        type: string
    BrandNameQuery:
      name: brand_name
      in: query
      required: false
      schema:
        type: string
    ProvinceQuery:
      name: province
      in: query
      required: false
      schema:
        type: string
    CityQuery:
      name: city
      in: query
      required: false
      schema:
        type: string
    PageQuery:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100
  schemas:
    ImportBatchResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        profile: { type: string, enum: [OWNER_OUTLET, NON_REGISTER] }
        original_filename: { type: string }
        status: { type: string, enum: [UPLOADED, VALIDATING, VALIDATED, VALIDATION_FAILED, COMMITTING, COMMITTED, COMMIT_FAILED] }
        total_rows: { type: integer }
        valid_rows: { type: integer }
        invalid_rows: { type: integer }
        committed_rows: { type: integer }
        error_message: { type: string, nullable: true }
        uploaded_at: { type: string, format: date-time }
        validated_at: { type: string, format: date-time, nullable: true }
        committed_at: { type: string, format: date-time, nullable: true }
    ImportRowResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        batch_id: { type: integer, format: int64 }
        row_index: { type: integer, description: "Nomor baris Excel asli (1-based)" }
        raw_payload: { type: object, description: "Kolom yang sudah dipetakan & dinormalisasi; kolom OTP tidak pernah muncul di sini" }
        status: { type: string, enum: [PENDING, VALID, INVALID, COMMITTED, COMMIT_FAILED] }
        validation_errors:
          type: array
          items: { type: string }
        owner_id: { type: integer, format: int64, nullable: true }
        outlet_id: { type: integer, format: int64, nullable: true }
        lead_id: { type: integer, format: int64, nullable: true }
        commit_error: { type: string, nullable: true }
    BulkSetTargetRequest:
      type: object
      required: [period_year, period_month, metric_code, target_value]
      properties:
        period_year: { type: integer }
        period_month: { type: integer, minimum: 1, maximum: 12 }
        metric_code: { type: string, example: "CONFIRMED_CLOSING_COUNT" }
        target_value: { type: string, example: "10.00" }
    OverrideTargetRequest:
      type: object
      required: [period_year, period_month, metric_code, target_value]
      properties:
        period_year: { type: integer }
        period_month: { type: integer, minimum: 1, maximum: 12 }
        metric_code: { type: string }
        target_value: { type: string }
    SalesTargetResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        sales_id: { type: integer, format: int64 }
        sales_name: { type: string }
        metric_code: { type: string }
        metric_name: { type: string }
        metric_unit: { type: string }
        period_year: { type: integer }
        period_month: { type: integer }
        target_value: { type: string }
        source: { type: string, enum: [BULK, OVERRIDE] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateKpiDefinitionRequest:
      type: object
      required: [metric_code, period_year, period_month, weight]
      properties:
        metric_code: { type: string, example: "CONFIRMED_CLOSING_COUNT" }
        period_year: { type: integer }
        period_month: { type: integer, minimum: 1, maximum: 12 }
        weight: { type: string, example: "40.00", description: "Persen, seluruh definisi aktif per periode harus total 100" }
        threshold_achieved: { type: string, default: "100.00" }
        threshold_near: { type: string, default: "80.00" }
    KpiDefinitionResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        metric_code: { type: string }
        metric_name: { type: string }
        metric_unit: { type: string }
        period_year: { type: integer }
        period_month: { type: integer }
        weight: { type: string }
        threshold_achieved: { type: string }
        threshold_near: { type: string }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RecomputeRequest:
      type: object
      required: [period_year, period_month]
      properties:
        period_year: { type: integer }
        period_month: { type: integer, minimum: 1, maximum: 12 }
    JobResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        job_type: { type: string, example: "KPI_RECOMPUTE" }
        status: { type: string, enum: [PENDING, PROCESSING, COMPLETED, FAILED] }
        attempts: { type: integer }
        max_attempts: { type: integer }
        last_error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
    SalesKpiMetricResultResponse:
      type: object
      properties:
        metric_code: { type: string }
        target_value: { type: string }
        actual_value: { type: string }
        achievement_pct: { type: string }
        weighted_score: { type: string }
    SalesKpiResultResponse:
      type: object
      properties:
        sales_id: { type: integer, format: int64 }
        sales_name: { type: string }
        period_year: { type: integer }
        period_month: { type: integer }
        total_score: { type: string }
        classification: { type: string, enum: [ACHIEVED, NEAR_ACHIEVED, NOT_ACHIEVED] }
        rank_position: { type: integer, nullable: true }
        computed_at: { type: string, format: date-time }
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/SalesKpiMetricResultResponse"
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
    CreateSalesRequest:
      type: object
      required: [name, email]
      properties:
        code:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          format: password
          description: Optional; jika kosong sistem membuat temporary password.
    UpdateSalesRequest:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
    ResetPasswordRequest:
      type: object
      properties:
        new_password:
          type: string
          format: password
          description: Optional; jika kosong sistem membuat temporary password.
    CreateTopupRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
          example: "1000000.00"
          description: Decimal string; tidak boleh float JSON agar presisi uang aman.
        payment_channel:
          type: string
          example: MIDTRANS
        external_reference:
          type: string
          example: MIDTRANS-TRX-20260723-001
        idempotency_key:
          type: string
          example: topup-owner-1-20260723
          description: Wajib jika external_reference kosong. Digunakan agar payment yang sama tidak diproses dua kali.
        paid_at:
          type: string
          format: date-time
          example: "2026-07-23T10:30:00Z"
        note:
          type: string
          example: Top-up via transfer BCA.
    CreateWalletTransactionRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
          example: "250000.00"
        direction:
          type: string
          enum: [CREDIT, DEBIT]
          description: Wajib untuk adjustment; diabaikan oleh debit/refund karena debit/refund selalu DEBIT.
        source_reference:
          type: string
          example: MANUAL-CORRECTION-001
        external_reference:
          type: string
          example: EXT-LEDGER-001
        idempotency_key:
          type: string
          example: wallet-ledger-owner-1-001
        occurred_at:
          type: string
          format: date-time
          example: "2026-07-23T11:00:00Z"
        note:
          type: string
          example: Koreksi saldo manual oleh Admin.
    OwnerRef:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
    UserBrief:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        role:
          type: string
    WalletAccountResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        owner:
          $ref: "#/components/schemas/OwnerRef"
        account_code:
          type: string
          example: WALLET-OWNER-000001
        currency:
          type: string
          example: IDR
        balance:
          type: string
          example: "1500000.00"
        ledger_balance:
          type: string
          example: "1500000.00"
        status:
          type: string
          enum: [ACTIVE]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WalletPaymentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        owner:
          $ref: "#/components/schemas/OwnerRef"
        wallet_account_id:
          type: integer
          format: int64
        payment_type:
          type: string
          enum: [TOPUP]
        payment_channel:
          type: string
        external_reference:
          type: string
        idempotency_key:
          type: string
        amount:
          type: string
        currency:
          type: string
        status:
          type: string
          enum: [PAID]
        paid_at:
          type: string
          format: date-time
        note:
          type: string
        created_by:
          $ref: "#/components/schemas/UserBrief"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WalletTransactionResponse:
