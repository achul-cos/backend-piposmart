      operationId: listReportByKey
      description: Mengembalikan report generik berbentuk `columns` + `items` agar frontend mudah membangun tabel lintas modul. Report key yang didukung yaitu `owners_outlets`, `activities`, `topups`, `closings`, `subscriptions`, `partners`, `targets_kpi`, `admin_owner_outlet`, `admin_new_subscribe`, dan `admin_nasabah_baru_provinsi`.
      security:
        - bearerAuth: []
      parameters:
        - name: report_key
          in: path
          required: true
          schema:
            type: string
            enum: [owners_outlets, activities, topups, closings, subscriptions, partners, targets_kpi, admin_owner_outlet, admin_new_subscribe, admin_nasabah_baru_provinsi]
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: created_from
          in: query
          schema:
            type: string
            format: date
          description: Filter rentang tanggal dibuat aktual data (`created_at`). Harus dipakai berpasangan dengan `created_to`.
        - name: created_to
          in: query
          schema:
            type: string
            format: date
          description: Filter rentang tanggal dibuat aktual data (`created_at`). Harus dipakai berpasangan dengan `created_from`.
        - name: status
          in: query
          schema:
            type: string
          description: Filter status sesuai modul report yang dipilih.
        - name: q
          in: query
          schema:
            type: string
          description: Pencarian umum.
        - name: province
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: sales_id
          in: query
          schema:
            type: integer
            format: int64
          description: Opsional. Umumnya dipakai Admin/Supervisor untuk narrowing data sales tertentu.
        - name: supervisor_id
          in: query
          schema:
            type: integer
            format: int64
          description: Opsional. Dipakai untuk narrowing data per supervisor bila report mendukung.
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: all
          in: query
          schema:
            type: boolean
            default: false
          description: Jika `true`, backend mengembalikan seluruh item tanpa pagination praktis untuk keperluan export atau tabel penuh.
      responses:
        "200":
          description: Report berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportListSuccessEnvelope"
        "400":
          description: "report_key tidak dikenali atau parameter query tidak valid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Actor tidak memiliki akses terhadap report yang diminta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Error internal saat membangun report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
