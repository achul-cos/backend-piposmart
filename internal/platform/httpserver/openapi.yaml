openapi: 3.0.3
info:
  title: Backend CRM Piposmart
  version: 0.7.0-sprint-7
  description: API CRM Piposmart dengan Owner/Outlet, Lead Ownership, Activity, Training, dan Catalog Package/Plan/Promotion Sprint 7.
servers:
  - url: http://localhost:8080
paths:
  /:
    get:
      summary: Informasi service
      operationId: getServiceInfo
      responses:
        "200":
          description: Service berjalan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /health/live:
    get:
      summary: Liveness check
      operationId: getLiveness
      responses:
        "200":
          description: Process API hidup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /health/ready:
    get:
      summary: Readiness check
      operationId: getReadiness
      responses:
        "200":
          description: API dan MySQL siap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "503":
          description: Dependency belum siap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/status:
    get:
      summary: Status API versi 1
      operationId: getAPIStatus
      responses:
        "200":
          description: API versi 1 berjalan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/auth/login:
    post:
      summary: Login user CRM
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Credential salah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/auth/refresh:
    post:
      summary: Rotasi refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token baru berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/auth/logout:
    post:
      summary: Logout dan revoke refresh token
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Logout berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/auth/me:
    get:
      summary: Profil user login
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profil user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/auth/change-password:
    post:
      summary: Ganti password user login
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password berhasil diganti
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/sales:
    get:
      summary: List akun Sales
      operationId: listSales
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, INACTIVE]
      responses:
        "200":
          description: List Sales
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    post:
      summary: Membuat akun Sales
      operationId: createSales
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSalesRequest"
      responses:
        "201":
          description: Sales dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/sales/{id}:
    get:
      summary: Detail akun Sales
      operationId: getSales
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Detail Sales
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    patch:
      summary: Update akun Sales
      operationId: updateSales
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSalesRequest"
      responses:
        "200":
          description: Sales diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/sales/{id}/activate:
    post:
      summary: Aktivasi akun Sales
      operationId: activateSales
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Sales aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/sales/{id}/deactivate:
    post:
      summary: Deaktivasi akun Sales
      operationId: deactivateSales
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Sales nonaktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/sales/{id}/reset-password:
    post:
      summary: Reset password Sales
      operationId: resetSalesPassword
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password Sales direset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/owners:
    get:
      summary: List owner laundry
      operationId: listOwners
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/CodeQuery"
        - $ref: "#/components/parameters/NameQuery"
        - $ref: "#/components/parameters/PhoneQuery"
        - $ref: "#/components/parameters/BrandNameQuery"
        - $ref: "#/components/parameters/ProvinceQuery"
        - $ref: "#/components/parameters/CityQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - name: sort
          in: query
          required: false
          schema:
            type: string
            example: "-created_at"
          description: Field sorting yang didukung `created_at`, `updated_at`, `code`, `name`, `brand_name`, `city`, `province`. Prefix `-` untuk descending.
      responses:
        "200":
          description: List owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    post:
      summary: Membuat owner laundry
      operationId: createOwner
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOwnerRequest"
      responses:
        "201":
          description: Owner dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/owners/bulk:
    post:
      summary: Bulk create owner laundry
      operationId: bulkCreateOwners
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkOwnerCreateRequest"
      responses:
        "201":
          description: Owner dibuat secara bulk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    patch:
      summary: Bulk update owner laundry
      operationId: bulkUpdateOwners
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkOwnerUpdateRequest"
      responses:
        "200":
          description: Owner diperbarui secara bulk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    delete:
      summary: Bulk soft delete owner laundry
      operationId: bulkDeleteOwners
      description: Mengisi `deleted_at` owner terpilih tanpa menghapus outlet child.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkIDRequest"
      responses:
        "200":
          description: Owner dihapus soft delete secara bulk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/owners/bulk/force:
    delete:
      summary: Bulk hard delete owner laundry
      operationId: bulkForceDeleteOwners
      description: Menghapus owner permanen. Outlet child tidak dihapus; `owner_id` outlet menjadi `null`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkIDRequest"
      responses:
        "200":
          description: Owner dihapus permanen secara bulk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/owners/{owner_id}:
    get:
      summary: Detail owner laundry
      operationId: getOwner
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OwnerID"
      responses:
        "200":
          description: Detail owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    patch:
      summary: Update owner laundry
      operationId: updateOwner
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OwnerID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOwnerRequest"
      responses:
        "200":
          description: Owner diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    delete:
      summary: Soft delete owner laundry
      operationId: deleteOwner
      description: Mengisi `deleted_at` owner tanpa menghapus outlet child.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OwnerID"
      responses:
        "200":
          description: Owner dihapus secara soft delete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/owners/{owner_id}/restore:
    patch:
      summary: Restore owner laundry
      operationId: restoreOwner
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OwnerID"
      responses:
        "200":
          description: Owner berhasil dipulihkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/owners/{owner_id}/force:
    delete:
      summary: Hard delete owner laundry
      operationId: forceDeleteOwner
      description: Menghapus owner permanen. Outlet child tidak dihapus; `owner_id` outlet menjadi `null`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OwnerID"
      responses:
        "200":
          description: Owner berhasil dihapus permanen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/owners/{owner_id}/outlets:
    get:
      summary: List outlet milik owner
      operationId: listOwnerOutlets
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OwnerID"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/CodeQuery"
        - $ref: "#/components/parameters/NameQuery"
        - $ref: "#/components/parameters/PhoneQuery"
        - $ref: "#/components/parameters/ProvinceQuery"
        - $ref: "#/components/parameters/CityQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: List outlet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    post:
      summary: Membuat outlet untuk owner
      operationId: createOwnerOutlet
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OwnerID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOutletRequest"
      responses:
        "201":
          description: Outlet dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/owners/{owner_id}/outlets/bulk:
    post:
      summary: Bulk create outlet milik owner
      operationId: bulkCreateOwnerOutlets
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OwnerID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkOutletCreateRequest"
      responses:
        "201":
          description: Outlet dibuat secara bulk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    patch:
      summary: Bulk update outlet milik owner
      operationId: bulkUpdateOwnerOutlets
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OwnerID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkOutletUpdateRequest"
      responses:
        "200":
          description: Outlet diperbarui secara bulk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    delete:
      summary: Bulk soft delete outlet milik owner
      operationId: bulkDeleteOwnerOutlets
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OwnerID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkIDRequest"
      responses:
        "200":
          description: Outlet dihapus soft delete secara bulk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/owners/{owner_id}/outlets/bulk/force:
    delete:
      summary: Bulk hard delete outlet milik owner
      operationId: bulkForceDeleteOwnerOutlets
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OwnerID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkIDRequest"
      responses:
        "200":
          description: Outlet dihapus permanen secara bulk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/owners/{owner_id}/outlets/{outlet_id}:
    get:
      summary: Detail outlet milik owner
      operationId: getOwnerOutlet
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OwnerID"
        - $ref: "#/components/parameters/OutletID"
      responses:
        "200":
          description: Detail outlet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    patch:
      summary: Update outlet milik owner
      operationId: updateOwnerOutlet
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OwnerID"
        - $ref: "#/components/parameters/OutletID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOutletRequest"
      responses:
        "200":
          description: Outlet diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    delete:
      summary: Soft delete outlet milik owner
      operationId: deleteOwnerOutlet
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OwnerID"
        - $ref: "#/components/parameters/OutletID"
      responses:
        "200":
          description: Outlet dihapus secara soft delete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/owners/{owner_id}/outlets/{outlet_id}/restore:
    patch:
      summary: Restore outlet milik owner
      operationId: restoreOwnerOutlet
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OwnerID"
        - $ref: "#/components/parameters/OutletID"
      responses:
        "200":
          description: Outlet berhasil dipulihkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/owners/{owner_id}/outlets/{outlet_id}/force:
    delete:
      summary: Hard delete outlet milik owner
      operationId: forceDeleteOwnerOutlet
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OwnerID"
        - $ref: "#/components/parameters/OutletID"
      responses:
        "200":
          description: Outlet berhasil dihapus permanen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/leads:
    get:
      summary: List customer lead sesuai ownership actor
      operationId: listLeads
      description: Admin melihat semua lead, Supervisor melihat lead miliknya dan Sales di bawahnya, Sales hanya melihat lead miliknya.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - name: ownership
          in: query
          schema:
            type: string
            enum: [ADMIN, SUPERVISOR, SALES]
        - name: stage
          in: query
          schema:
            type: string
            example: POSSIBLE
        - name: status
          in: query
          schema:
            type: string
            example: OPEN
        - name: score
          in: query
          schema:
            type: integer
            enum: [0, 1, 2, 3]
        - name: supervisor_id
          in: query
          schema:
            type: integer
            format: int64
        - name: sales_id
          in: query
          schema:
            type: integer
            format: int64
        - name: follow_up_from
          in: query
          schema:
            type: string
            format: date
        - name: follow_up_to
          in: query
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: List lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    post:
      summary: Membuat lead dari owner yang sudah ada
      operationId: createLead
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeadRequest"
      responses:
        "201":
          description: Lead dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/leads/bulk/assign-supervisor:
    post:
      summary: Bulk assign lead dari Admin ke Supervisor
      operationId: bulkAssignSupervisor
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkAssignSupervisorRequest"
      responses:
        "200":
          description: Lead berhasil dibagikan ke Supervisor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/leads/bulk/assign-sales:
    post:
      summary: Bulk assign lead dari Supervisor ke Sales
      operationId: bulkAssignSales
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkAssignSalesRequest"
      responses:
        "200":
          description: Lead berhasil dibagikan ke Sales
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/leads/bulk/release:
    post:
      summary: Bulk release lead kembali ke Admin
      operationId: bulkReleaseLead
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkReleaseLeadRequest"
      responses:
        "200":
          description: Lead berhasil dikembalikan ke Admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/leads/{lead_id}:
    get:
      summary: Detail customer lead
      operationId: getLead
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LeadID"
      responses:
        "200":
          description: Detail lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/leads/{lead_id}/assignment-history:
    get:
      summary: Riwayat perpindahan ownership lead
      operationId: getLeadAssignmentHistory
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LeadID"
      responses:
        "200":
          description: Riwayat assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/leads/{lead_id}/assign-supervisor:
    post:
      summary: Assign lead dari Admin ke Supervisor
      operationId: assignSupervisor
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LeadID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignSupervisorRequest"
      responses:
        "200":
          description: Lead berhasil dibagikan ke Supervisor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/leads/{lead_id}/assign-sales:
    post:
      summary: Assign atau redistribusi lead dari Supervisor ke Sales
      operationId: assignSales
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LeadID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignSalesRequest"
      responses:
        "200":
          description: Lead berhasil dibagikan ke Sales
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/leads/{lead_id}/release:
    post:
      summary: Release lead kembali ke Admin
      operationId: releaseLead
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LeadID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseLeadRequest"
      responses:
        "200":
          description: Lead berhasil dikembalikan ke Admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/leads/{lead_id}/mark-invalid:
    post:
      summary: Sales menandai lead invalid dari remark 0
      operationId: markLeadInvalid
      description: Lead berpindah kembali ke Supervisor, score menjadi 0, status menjadi INVALID.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LeadID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkInvalidRequest"
      responses:
        "200":
          description: Lead berhasil ditandai invalid
          content:
            application/json:
              schema:
