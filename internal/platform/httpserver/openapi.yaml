        base_amount:
          type: string
          description: Snapshot final_amount closing saat komisi dihitung
          example: "1000000.00"
        commission_amount:
          type: string
          example: "50000.00"
        currency:
          type: string
          example: IDR
        status:
          type: string
          enum: [PENDING, APPROVED, PAID, CANCELLED]
        note:
          type: string
          nullable: true
        approved_by:
          $ref: "#/components/schemas/PartnerCommissionUserBrief"
        approved_at:
          type: string
          format: date-time
          nullable: true
        paid_by:
          $ref: "#/components/schemas/PartnerCommissionUserBrief"
        paid_at:
          type: string
          format: date-time
          nullable: true
        active_payout_id:
          type: integer
          format: int64
          nullable: true
          description: ID payout PENDING/PAID yang sedang membatch commission ini, jika ada. Commission dengan field ini terisi tidak bisa dibayar/dibatalkan individual (409 COMMISSION_IN_PAYOUT)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PartnerCommissionUserBrief:
      type: object
      nullable: true
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        role:
          type: string
    PartnerCommissionListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PartnerCommissionResponse"
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
              format: int64
    SyncCommissionsResponse:
      type: object
      properties:
        created:
          type: integer
          format: int64
          description: Jumlah commission record baru yang dibuat pada pemanggilan ini
        items:
          type: array
          items:
            $ref: "#/components/schemas/PartnerCommissionResponse"
    CommissionActionRequest:
      type: object
      properties:
        note:
          type: string
          nullable: true
          example: Closing dibatalkan, komisi tidak jadi dibayarkan
    CreateCommissionTierRequest:
      type: object
      required: [tier_order, min_closings, mode, value]
      properties:
        tier_order:
          type: integer
          minimum: 1
          description: Urutan tier (1, 2, 3, ...), harus berurutan tanpa celah
          example: 1
        min_closings:
          type: integer
          minimum: 1
          description: Batas bawah jumlah closing confirmed bulanan untuk tier ini. Tier pertama harus mulai dari 1, tier berikutnya harus lanjut tepat setelah max_closings tier sebelumnya
          example: 1
        max_closings:
          type: integer
          nullable: true
          description: Batas atas jumlah closing confirmed bulanan untuk tier ini. Null berarti open-ended — WAJIB null pada tier terakhir agar semua jumlah closing punya tier yang cocok
          example: 3
        mode:
          type: string
          enum: [PERCENTAGE, FIXED]
          description: Mode rate tier ini (tier tidak bisa nested TIER)
        value:
          type: string
          description: Rate tier ini — persen (0-100) jika PERCENTAGE, nominal jika FIXED
          example: "2.00"
    CreateCommissionRuleRequest:
      type: object
      required: [mode, effective_from]
      properties:
        package_id:
          type: integer
          format: int64
          nullable: true
          description: Jika diisi, rule ini hanya berlaku untuk closing dengan package tersebut (lebih spesifik daripada rule type-wide). Null berarti berlaku untuk semua package partner_type ini
          example: 2
        mode:
          type: string
          enum: [PERCENTAGE, FIXED, TIER]
        value:
          type: string
          nullable: true
          description: Wajib diisi untuk PERCENTAGE/FIXED, wajib kosong (null) untuk TIER — rate TIER ditentukan dari field tiers
          example: "5.00"
        effective_from:
          type: string
          format: date
          description: Tanggal rule mulai berlaku (dibandingkan terhadap sales_closings.confirmed_at)
          example: "2026-07-01"
        effective_to:
          type: string
          format: date
          nullable: true
          description: Tanggal rule berhenti berlaku. Null berarti berlaku tanpa batas waktu sampai dinonaktifkan
        tiers:
          type: array
          description: Wajib diisi (minimal 1 tier) jika mode TIER, harus kosong untuk mode lain
          items:
            $ref: "#/components/schemas/CreateCommissionTierRequest"
