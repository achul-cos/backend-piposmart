    CreateInteractionRequest:
      type: object
      description: |
        Sprint 15b: satu interaction dapat menyimpan channel CALL, CHAT, atau keduanya sekaligus.
        Field `call_status` dan `chat_status` menjadi format utama. Field `type` tetap diterima sementara untuk backward compatibility.
      properties:
        type:
          type: string
          enum: [CALL, CHAT, CALL_CHAT]
          description: Deprecated compatibility field. Gunakan `call_status` dan/atau `chat_status` sebagai format utama request baru.
          example: CALL
        call_status:
          type: string
          nullable: true
          description: Status hasil channel call pada interaction ini. Jika diisi bersama `chat_status`, backend akan menyimpan satu interaction bertipe `CALL_CHAT`.
          example: TERHUBUNG
        chat_status:
          type: string
          nullable: true
          description: Status hasil channel chat pada interaction ini. Jika diisi bersama `call_status`, backend akan menyimpan satu interaction bertipe `CALL_CHAT`.
          example: TERBALAS
        interaction_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-07-23T10:00:00+07:00"
        contact_name:
          type: string
          example: Budi Santoso
        contact_phone:
          type: string
          example: "081234567890"
        duration_seconds:
          type: integer
          nullable: true
          example: 300
        remark_reason_id:
          type: integer
          format: int64
          nullable: true
        remark_score:
          type: integer
          enum: [0, 1, 2, 3]
          nullable: true
          description: 0 invalid, 1 kemungkinan, 2 potensial, 3 closing.
        note:
          type: string
          example: Customer tertarik demo.
        customer_response:
          type: string
          example: Minta dijadwalkan training online.
        follow_up_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-07-28T10:00:00+07:00"
        follow_up_note:
          type: string
          example: Follow-up jadwal training.
