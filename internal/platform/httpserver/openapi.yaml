  /api/v1/analytics/catalog:
    get:
      tags: [Analytics]
      summary: Ambil seluruh katalog diagram analytics
      operationId: getAnalyticsCatalog
      description: |
        Mengembalikan metadata seluruh diagram analytics Sprint 14g1 sampai 14g5.

        Catalog ini adalah source of truth frontend untuk:
        - daftar diagram yang tersedia;
        - nama diagram;
        - tujuan dan cara membaca diagram;
        - metric yang didukung;
        - compare mode yang didukung;
        - route query diagram.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Daftar seluruh diagram analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsCatalogListEnvelope"
              examples:
                fullCatalog:
                  summary: Contoh respons katalog analytics
                  value:
                    data:
                      items:
                        - module: owners
                          key: growth-trend
                          name: Tren Pertumbuhan Owner
                          type: line
                          function: Melihat owner baru per periode
                          purpose: Memantau pertumbuhan owner
                          how_to_read: Lihat garis per hari atau bulan untuk melihat pertumbuhan owner.
                          analysis_goal: Mengetahui apakah akuisisi owner naik atau turun.
                          supported_metrics: [owner_count]
                          supported_filters: [province, city, sales_id, supervisor_id, owner_id, status]
                          supported_compare_modes: [previous_period]
                          query_endpoint: /api/v1/analytics/owners/growth-trend/query
                          polarity_rule: higher_is_better
                          export_available: false
                          comparison_enabled: true
                        - module: executive
                          key: north-star-kpi-trend
                          name: North Star KPI Trend
                          type: line
                          function: Melihat KPI utama bisnis dalam satu tren
                          purpose: Ringkasan KPI inti manajemen
                          how_to_read: Bandingkan tren owner, closing, topup, dan active subscription pada periode yang dipilih.
                          analysis_goal: Mengetahui arah pertumbuhan bisnis secara menyeluruh.
                          supported_metrics: [owner_count, confirmed_closing_count, topup_revenue, active_subscription_count]
                          supported_filters: [province, city, sales_id, supervisor_id, owner_id, outlet_id, status]
                          supported_compare_modes: [previous_period]
                          query_endpoint: /api/v1/analytics/executive/north-star-kpi-trend/query
                          polarity_rule: higher_is_better
                          export_available: false
                          comparison_enabled: true
                    meta:
                      request_id: 6c2a40d0f9cb4f1d8b1e3d4a6407a112
        "401":
          description: Token akses tidak dikirim atau tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                unauthenticated:
                  value:
                    error:
                      code: UNAUTHENTICATED
                      message: Token akses wajib dikirim
                      request_id: 58c7a302d05a9b15daea677fb2213c46
