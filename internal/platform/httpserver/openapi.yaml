  /api/v1/analytics/{module}/{diagram}/query:
    post:
      tags: [Analytics]
      summary: Query data diagram analytics
      operationId: queryAnalyticsDiagram
      description: |
        Menjalankan query analytics untuk diagram tertentu berdasarkan `module` dan `diagram`.

        Endpoint generik ini dipakai oleh seluruh implementasi Sprint 14g1 sampai 14g5, termasuk:
        - owner, outlet, lead, interaction, training;
        - catalog, closing, target, KPI;
        - wallet, subscription, reconciliation;
        - partner, commission, audit;
        - imports, executive board, dan custom comparison.

        Catatan penting untuk frontend:
        - gunakan `GET /api/v1/analytics/catalog` sebagai daftar resmi diagram;
        - jangan mengirim `comparison.mode` di luar `supported_compare_modes`;
        - validasi rentang waktu sebelum submit;
        - response kosong tetap bisa valid, jadi bedakan data kosong dengan error.
      security:
        - bearerAuth: []
      parameters:
        - name: module
          in: path
          required: true
          schema:
            type: string
          description: Nama modul analytics
          example: owners
        - name: diagram
          in: path
          required: true
          schema:
            type: string
          description: Key diagram analytics
          example: growth-trend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsQueryRequest"
            examples:
              sprint14g1OwnerGrowth:
                summary: Sprint 14g1 - growth trend owner
                value:
                  time_filter:
                    mode: month_range
                    month_from: "2026-01"
                    month_to: "2026-07"
                    granularity: month
                  comparison:
                    enabled: false
                  filters: {}
                  options:
                    include_summary: true
                    include_table: true
              sprint14g2ClosingBySales:
                summary: Sprint 14g2 - closing by sales
                value:
                  time_filter:
                    mode: month_range
                    month_from: "2026-01"
                    month_to: "2026-07"
                    granularity: month
                  comparison:
                    enabled: false
                  metrics: [confirmed_closing_count]
                  options:
                    include_summary: true
                    include_table: true
              sprint14g3RenewalRate:
                summary: Sprint 14g3 - renewal rate subscription
                value:
                  time_filter:
                    mode: month_range
                    month_from: "2026-01"
                    month_to: "2026-07"
                    granularity: month
                  comparison:
                    enabled: false
                  options:
                    include_summary: true
                    include_table: true
              sprint14g4PartnerInactivity:
                summary: Sprint 14g4 - partner inactivity aging
                value:
                  time_filter:
                    mode: month_range
                    month_from: "2026-01"
                    month_to: "2026-07"
                    granularity: month
                  comparison:
                    enabled: false
                  options:
                    include_summary: true
                    include_table: true
              sprint14g5NorthStar:
                summary: Sprint 14g5 - north star KPI trend
                value:
                  time_filter:
                    mode: month_range
                    month_from: "2026-01"
                    month_to: "2026-07"
                    granularity: month
                  comparison:
                    enabled: true
                    mode: previous_period
                  metrics: [owner_count, confirmed_closing_count, topup_revenue, active_subscription_count]
                  options:
                    include_summary: true
                    include_table: true
              sprint14g5RegionComparison:
                summary: Sprint 14g5 - region comparison board
                value:
                  time_filter:
                    mode: month_range
                    month_from: "2026-01"
                    month_to: "2026-07"
                    granularity: month
                  comparison:
                    enabled: true
                    mode: series_to_series
                    compare_series:
                      - field: province
                        label: Jawa Barat
                        value: Jawa Barat
                      - field: province
                        label: Jawa Tengah
                        value: Jawa Tengah
                  metrics: [owner_count, outlet_count]
                  options:
                    include_summary: true
                    include_table: true
      responses:
        "200":
          description: Hasil query diagram analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsQueryEnvelope"
              examples:
                ownerGrowth:
                  summary: Sprint 14g1 - response owner growth
                  value:
                    data:
                      diagram:
                        module: owners
                        key: growth-trend
                        name: Tren Pertumbuhan Owner
                        type: line
                        function: Melihat owner baru per periode
                        purpose: Memantau pertumbuhan owner
                        how_to_read: Lihat garis per hari atau bulan untuk melihat pertumbuhan owner.
                        analysis_goal: Mengetahui apakah akuisisi owner naik atau turun.
                      time_filter:
                        mode: month_range
                        month_from: "2026-01"
                        month_to: "2026-07"
                        granularity: month
                        label: Jan 2026 - Jul 2026
                      comparison:
                        enabled: false
                      series:
                        - key: owner_count
                          label: Owner Baru
                          points:
                            - x: "2026-01"
                              y: 3
                            - x: "2026-02"
                              y: 4
                            - x: "2026-03"
                              y: 4
                      table:
                        - period: "2026-01"
                          owner_count: 3
                        - period: "2026-02"
                          owner_count: 4
                      insight:
                        summary: Tren Pertumbuhan Owner pada periode terpilih bernilai 47.00.
                        conclusion: Mengetahui apakah akuisisi owner naik atau turun.
                        recommendation: Bandingkan tren current period dengan periode sebelumnya untuk melihat momentum pertumbuhan.
                    meta:
                      request_id: 87065b0b66114d54a0b62cab1dcb7df9
                closingBySales:
                  summary: Sprint 14g2 - response closing by sales
                  value:
                    data:
                      diagram:
                        module: closings
                        key: closing-by-sales
                        name: Closing by Sales
                        type: horizontal_bar
